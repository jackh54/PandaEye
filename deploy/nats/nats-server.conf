# PandaEye NATS server, single node with JetStream (docker-compose, staging, small production).
# For the 3-node R3 production cluster use nats-cluster.conf. Validate with: nats-server -t -c <file>
#
# Requirements from docs/ARCHITECTURE.md 5.4: JetStream enabled, max_payload >= 8 MiB (checked by every
# PandaEye service at start), credentials and TLS for every non-loopback client.
#
# Authentication is decentralised (operator / JWT): auth/server/resolver.conf holds the operator JWT and the
# SYS and PANDAEYE account JWTs, and every PandaEye role connects with its own creds file
# (PE_NATS_CREDS) whose user JWT carries that role's subject permissions. Generate both with
#   make -C deploy nats-auth        (cd deploy/nats/gen-auth && go run . -out ../auth)
# Permissions per role: docs/OPERATIONS.md "NATS" (make -C deploy nats-permissions).

server_name: "pe-nats-1"
listen: "0.0.0.0:4222"

# Monitoring (/healthz, /varz, /jsz). No authentication: never publish this port outside the private
# network. Scrape it with a Prometheus NATS exporter for consumer lag (docs/OPERATIONS.md "Monitoring").
http: "0.0.0.0:8222"

# 8 MiB exactly: a decompressed plugin batch may be up to 8 MiB (wire.proto).
max_payload: 8388608
# Per-role user JWTs carry their subject permissions and travel in the CONNECT line, which can exceed
# the 4 KiB default.
max_control_line: 8192
# Slow consumers are disconnected instead of growing server memory.
write_deadline: "10s"

# Client TLS. Clients verify the server with PE_NATS_TLS_CA. Development certificates:
# deploy/scripts/gen-dev-certs.sh; use certificates from your own CA in production.
tls {
  cert_file: "/etc/nats/certs/nats.pem"
  key_file: "/etc/nats/certs/nats-key.pem"
  timeout: 2
}

jetstream {
  store_dir: "/data"
  # Default max_file_store: 75% of free disk. Size the volume for PE_EVENTS (PE_EVENTS_MAX_BYTES,
  # 10 GiB by default) + 7 days of PE_SIGNALS + 30 days of PE_VERDICTS.
  max_memory_store: 268435456
}

include "auth/server/resolver.conf"
