# PandaEye NATS cluster node (3 nodes, JetStream R3). The same file on every node; only the
# environment differs. Set PE_NATS_REPLICAS=3 on every PandaEye service and list all three nodes in
# PE_NATS_URL (comma separated, tls://).
#
# Environment of each nats-server process:
#   NATS_SERVER_NAME   unique per node: pe-nats-1, pe-nats-2, pe-nats-3
# Files (identical on every node):
#   auth/server/resolver.conf from deploy/nats/gen-auth (operator, SYS and PANDAEYE account JWTs)
#   /etc/nats/certs/*.pem    client certificate (nats.pem), route certificate (route.pem), cluster CA
# Validate with: NATS_SERVER_NAME=pe-nats-1 nats-server -t -c nats-cluster.conf

server_name: $NATS_SERVER_NAME
listen: "0.0.0.0:4222"
http: "0.0.0.0:8222"
max_payload: 8388608
write_deadline: "10s"
# Rolling restarts: a node in lame-duck mode stops accepting clients and spreads their reconnects over
# this period (send SIGUSR2 / `nats-server --signal ldm` before stopping it).
lame_duck_duration: "30s"
lame_duck_grace_period: "10s"

tls {
  cert_file: "/etc/nats/certs/nats.pem"
  key_file: "/etc/nats/certs/nats-key.pem"
  timeout: 2
}

jetstream {
  store_dir: "/data"
  max_memory_store: 268435456
}

cluster {
  name: "pandaeye"
  listen: "0.0.0.0:6222"
  # Mutual TLS between nodes: every route presents a certificate issued by the cluster CA.
  tls {
    cert_file: "/etc/nats/certs/route.pem"
    key_file: "/etc/nats/certs/route-key.pem"
    ca_file: "/etc/nats/certs/ca.pem"
    verify: true
    timeout: 2
  }
  routes: [
    "nats-route://pe-nats-1.internal:6222"
    "nats-route://pe-nats-2.internal:6222"
    "nats-route://pe-nats-3.internal:6222"
  ]
}

include "auth/server/resolver.conf"
