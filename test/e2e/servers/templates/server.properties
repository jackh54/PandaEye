# PandaEye e2e server template (low CPU, offline mode, flat void-biome world). @PORT@ etc. are substituted by provision.sh.
online-mode=false
enforce-secure-profile=false
server-ip=127.0.0.1
server-port=@PORT@
motd=PandaEye e2e @NAME@
max-players=100
level-name=world
level-type=minecraft\:flat
generator-settings={"layers"\:[{"block"\:"minecraft\:bedrock","height"\:1},{"block"\:"minecraft\:dirt","height"\:2},{"block"\:"minecraft\:grass_block","height"\:1}],"biome"\:"minecraft\:the_void","features"\:false,"lakes"\:false}
generate-structures=false
allow-nether=false
spawn-protection=0
view-distance=4
simulation-distance=4
difficulty=peaceful
gamemode=survival
force-gamemode=false
pvp=true
allow-flight=true
network-compression-threshold=@COMPRESSION@
rate-limit=0
player-idle-timeout=0
pause-when-empty-seconds=-1
sync-chunk-writes=false
enable-command-block=false
enable-rcon=false
enable-query=false
enable-status=true
log-ips=false
entity-broadcast-range-percentage=100
max-tick-time=60000
white-list=false
hide-online-players=false
