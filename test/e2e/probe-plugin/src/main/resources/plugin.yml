name: PandaEyeProbe
version: '${version}'
main: dev.pandascript.pandaeye.e2e.probe.ProbePlugin
api-version: '1.21'
folia-supported: true
depend: [packetevents]
description: PandaEye e2e probe (wire packet counters, PacketEvents LOWEST/MONITOR state, kicks, TPS)
commands:
  probe:
    description: PandaEye e2e probe
    usage: /probe help
    permission: pandaeye.e2e.probe
permissions:
  pandaeye.e2e.probe:
    default: op
