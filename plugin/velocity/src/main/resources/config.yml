# shadow = observe only: never kicks, bans or runs commands (the unban of a ban this proxy executed excepted).
# live   = KICK/BAN verdicts may run the proxy commands below when the dashboard also enables enforcement.
mode: shadow
# Every proxy ships as "proxy": give each one its own name (proxy-1, proxy-2, ...) so the dashboard can tell
# them apart. For another proxy copy only this file, never the folder (a copied server-id is refused).
server-name: "proxy"
network-id: ""
# HMAC secret for the pandaeye:session message sent to backends (must match proxy.secret on the backends).
session-secret: ""
cloud:
  enabled: true
  endpoint: "wss://eye.pandascript.dev/v1/connect"
  license-key: ""
  # ws:// is refused except to a loopback address unless this is true (cloud on a private network only).
  allow-insecure: false
  batch-interval-ms: 50
  max-buffer-mb: 64
  max-buffer-age-minutes: 10
# Proxy commands for verdicts (live mode only). Placeholders: %player% %uuid% %reason% %checks% %verdict_id%
# %appeal_code% %appeal_url% %duration%; values are sanitised (no spaces in names, no line breaks or colours).
punishments:
  kick-command: ""                                   # empty = disconnect the player with kick-message
  kick-message: "Unfair advantage detected"
  ban-command: ""                                    # empty = BAN verdicts are handled by the backends only
  unban-command: ""
  appeal-url: ""
  max-bans-per-hour: 3
  max-kicks-per-10min: 5
# LiteBans (optional, on this proxy): its bans become labels for the cloud, so verdict accuracy can be measured
# from what staff already do. Only "ban" entries count; reasons match as case-insensitive substrings. A ban is
# CHEAT when its reason has a cheat-reason and no ignore-reason (ignore wins) and staff issued it (the console
# too with count-console: console bans come from other anticheats or PandaEye's own ban-command). The removal
# of such a ban with a legit-unban-reason is LEGIT. Nothing else is sent; reasons, staff names and IPs never are.
# Without LiteBans this section does nothing. Changes need a restart.
labels:
  litebans:
    enabled: true
    cheat-reasons: [hack, cheat, blacklisted mod, modification, aura, reach, fly, speed, scaffold, autoclick,
      auto click, auto totem, autototem, easy place, easyplace, macro, script, nuker, bhop, velocity, timer, client]
    ignore-reasons: [x-ray, xray, esp, bot account, evad, alt, test]
    legit-unban-reasons: [false ban, falsely, wrongful, mistake, appeal accepted]
    count-console: false
    backfill-days: 30        # on enable, label the bans of the last N days once (0 = off)
debug: false
